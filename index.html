<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 번호 생성기</title>
<style>
  :root {
    --bg: #f4f5f9; --card: #ffffff; --text: #1d2130; --muted: #6b7185;
    --line: #e3e5ee; --accent: #3b5bdb; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161d; --card: #1e212b; --text: #eceef4; --muted: #9aa0b4;
            --line: #2e3240; --accent: #5c7cfa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 20px; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  select, input { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); min-width: 0; }
  .grow { flex: 1 1 160px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 18px;
           cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; min-height: 1em; }
  .hint.err { color: #e03131; }
  .game { display: flex; align-items: center; gap: 10px; padding: 10px 0;
          border-bottom: 1px solid var(--line); }
  .game:last-child { border-bottom: 0; }
  .tag { width: 22px; font-weight: 700; color: var(--muted); }
  .balls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ball { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
          font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35);
          box-shadow: inset -4px -6px 10px rgba(0,0,0,.18), inset 3px 4px 8px rgba(255,255,255,.35);
          animation: pop .35s ease-out both; }
  @keyframes pop { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .c1 { background: #fbc400; } .c2 { background: #69c8f2; } .c3 { background: #ff7272; }
  .c4 { background: #aaaaaa; } .c5 { background: #b0d840; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .row-head h2 { font-size: 16px; margin: 0; }
  .history .game { font-size: 14px; color: var(--muted); }
  .history .ball { width: 30px; height: 30px; font-size: 13px; animation: none; }
  .balls { align-items: center; }
  .plus { font-weight: 700; color: var(--muted); font-size: 18px; }
  .ball.bonus { outline: 2px dashed var(--muted); outline-offset: 2px; }
  .freq { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px 12px; }
  .fi { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .fi b { width: 18px; text-align: right; color: var(--text); }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; }
  #top .ball { width: 34px; height: 34px; font-size: 14px; }

  /* ── 추첨 연출 ── */
  .stage { text-align: center; font-weight: 700; font-size: 18px; min-height: 28px; margin-bottom: 8px; }
  .stage.big { font-size: 22px; color: #e8590c; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .game.active { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 12px; }
  .game { transition: background .3s; padding-left: 6px; padding-right: 6px; }
  .ball.pending { background: var(--line); color: var(--muted); text-shadow: none; box-shadow: none; animation: none; }
  .ball.spin { animation: shake .09s linear infinite; }
  @keyframes shake { 0% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-3px) rotate(8deg); } 100% { transform: translateY(0) rotate(-8deg); } }
  .ball.lock { animation: lock .5s cubic-bezier(.2, 1.8, .4, 1) both; }
  @keyframes lock { 0% { transform: scale(1.7); filter: brightness(1.6); } 100% { transform: scale(1); filter: none; } }
  .ball.bonus.lock { animation: lock .6s cubic-bezier(.2, 1.8, .4, 1) both, glow 1.2s ease-in-out .6s 3; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(255, 196, 0, .55), 0 0 24px 8px rgba(255, 196, 0, .6); } }
  .ball.settle { animation: settle .4s ease both; }
  @keyframes settle { from { transform: translateY(-10px); opacity: .3; } to { transform: none; opacity: 1; } }
  .row-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hidden { display: none; }
  @media (max-width: 420px) { .ball { width: 36px; height: 36px; font-size: 14px; } }
</style>
</head>
<body>
<main>
  <h1>🎱 로또 번호 생성기</h1>
  <p class="sub">1~45 중 중복 없이 6개 번호와 보너스 번호 1개를 뽑습니다.</p>

  <section class="card">
    <div class="controls">
      <label>게임 수
        <select id="count">
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option selected>5</option>
        </select>
      </label>
      <label class="grow">생성 방식
        <select id="mode">
          <option value="hot" selected>많이 나온 번호 우선</option>
          <option value="random">완전 랜덤</option>
        </select>
      </label>
      <label>통계 범위
        <select id="range">
          <option value="0" selected>전체 회차</option>
          <option value="100">최근 100회</option>
          <option value="50">최근 50회</option>
          <option value="20">최근 20회</option>
        </select>
      </label>
      <label class="grow">고정 번호 (최대 5개)
        <input id="fixed" placeholder="예: 7, 14">
      </label>
      <label class="grow">제외 번호
        <input id="exclude" placeholder="예: 1, 45">
      </label>
    </div>
    <p class="hint" id="hint"></p>
    <div class="row-btns">
      <button class="primary" id="gen">🎰 추첨 시작</button>
      <button class="ghost hidden" id="skip">⏩ 건너뛰기</button>
      <button class="ghost" id="copy">복사</button>
      <button class="ghost" id="sound">🔊 소리 켬</button>
    </div>
  </section>

  <section class="card">
    <div class="stage" id="stage"></div>
    <div id="result"><p class="empty">‘번호 생성’ 버튼을 눌러보세요.</p></div>
  </section>

  <section class="card">
    <div class="row-head"><h2>번호별 출현 횟수</h2><button class="ghost" id="update">최신 회차 불러오기</button></div>
    <p class="hint" id="dataInfo" style="margin:0 0 10px"></p>
    <div id="top" class="balls" style="margin-bottom:14px"></div>
    <div id="freq" class="freq"></div>
    <p class="hint">※ 매 회차 추첨은 독립적이라 과거에 많이 나온 번호가 다음에 더 잘 나오지는 않습니다. 재미로 즐겨주세요.</p>
  </section>

  <section class="card history">
    <div class="row-head"><h2>최근 생성 기록</h2><button class="ghost" id="clear">지우기</button></div>
    <div id="history"><p class="empty">기록이 없습니다.</p></div>
  </section>
</main>

<script src="lotto-data.js"></script>
<script>
const $ = id => document.getElementById(id);
let draws = typeof LOTTO_DRAWS !== "undefined" ? LOTTO_DRAWS : [];
const BALL_COLORS = ["#fbc400", "#69c8f2", "#ff7272", "#aaaaaa", "#b0d840"];

// 번호별 출현 횟수 (보너스 제외). range=0이면 전체, 아니면 최근 N회
function getFreq() {
  const range = +$("range").value;
  const used = range ? draws.slice(-range) : draws;
  const freq = Array(46).fill(0);
  used.forEach(d => d.slice(2, 8).forEach(n => freq[n]++));
  return { freq, used };
}

function renderStats() {
  const { freq, used } = getFreq();
  if (!draws.length) { $("dataInfo").textContent = "당첨번호 데이터가 없습니다. ‘최신 회차 불러오기’를 눌러주세요."; return; }
  const first = used[0], last = used[used.length - 1];
  $("dataInfo").textContent = `${first[0]}회(${first[1]}) ~ ${last[0]}회(${last[1]}) · ${used.length}회차 기준 · 많이 나온 번호 TOP 10`;
  const nums = Array.from({ length: 45 }, (_, i) => i + 1);
  const top = [...nums].sort((a, b) => freq[b] - freq[a]).slice(0, 10);
  $("top").innerHTML = top.map(n => `<span class="ball ${colorClass(n)}" title="${freq[n]}회" style="animation:none">${n}</span>`).join("");
  const max = Math.max(...freq);
  $("freq").innerHTML = nums.map(n =>
    `<div class="fi" title="${n}번: ${freq[n]}회"><b>${n}</b><div class="bar"><span style="width:${max ? freq[n] / max * 100 : 0}%;background:${BALL_COLORS[Math.ceil(n / 10) - 1]}"></span></div>${freq[n]}</div>`).join("");
}

$("range").onchange = renderStats;
$("update").onclick = async () => {
  $("update").textContent = "불러오는 중…";
  try {
    const res = await fetch("https://smok95.github.io/lotto/results/all.json");
    const data = await res.json();
    draws = data.map(d => [d.draw_no, d.date.slice(0, 10), ...d.numbers, d.bonus_no]);
    renderStats();
    $("update").textContent = `${draws[draws.length - 1][0]}회까지 반영됨`;
  } catch (e) {
    $("update").textContent = "불러오기 실패 (다시 시도)";
  }
};
const LABELS = "ABCDE";
let current = [];
let history = [];
try { history = JSON.parse(localStorage.getItem("lottoHistory") || "[]"); } catch (e) {}

function colorClass(n) { return "c" + Math.min(5, Math.ceil(n / 10)); }

function parseNums(text) {
  const nums = (text.match(/\d+/g) || []).map(Number);
  const bad = nums.filter(n => n < 1 || n > 45);
  return { nums: [...new Set(nums.filter(n => n >= 1 && n <= 45))], bad };
}

function randInt(max) { // 0..max-1, 암호학적 난수
  const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max;
}

function randFloat() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }

// 가중치 비례로 뽑기: 많이 나온 번호일수록 뽑힐 확률이 높음 (중복 없이)
function weightedPick(pool, weights) {
  const total = pool.reduce((s, n) => s + weights[n], 0);
  let r = randFloat() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[pool[i]];
    if (r < 0) return pool.splice(i, 1)[0];
  }
  return pool.pop();
}

function makeGame(fixed, exclude, weights) {
  const pool = [];
  for (let i = 1; i <= 45; i++) if (!fixed.includes(i) && !exclude.includes(i)) pool.push(i);
  const picked = [...fixed];
  while (picked.length < 6)
    picked.push(weights ? weightedPick(pool, weights) : pool.splice(randInt(pool.length), 1)[0]);
  picked.sort((a, b) => a - b);
  // 보너스 번호: 남은 번호 중 1개 (본 번호 6개와 겹치지 않음)
  const bonus = weights ? weightedPick(pool, weights) : pool.splice(randInt(pool.length), 1)[0];
  return [...picked, bonus];
}

// 출현 횟수가 많을수록 가중치를 크게 (평균 대비 차이를 3배로 강조)
function getWeights() {
  if ($("mode").value !== "hot" || !draws.length) return null;
  const { freq } = getFreq();
  const vals = freq.slice(1), min = Math.min(...vals), max = Math.max(...vals);
  return freq.map(f => max === min ? 1 : 1 + 3 * (f - min) / (max - min));
}

function ballsHTML(nums, delay) {
  const ball = (n, i) => `<span class="ball ${colorClass(n)}" style="animation-delay:${delay ? i * 0.08 : 0}s">${n}</span>`;
  const main = nums.slice(0, 6).map(ball).join("");
  if (nums.length < 7) return main;
  return main + `<span class="plus">+</span>` + ball(nums[6], 6).replace('class="ball', 'title="보너스" class="ball bonus');
}

function render() {
  if (!drawing) $("result").innerHTML = current.length
    ? current.map((g, i) => `<div class="game"><span class="tag">${LABELS[i]}</span><div class="balls">${ballsHTML(g, true)}</div></div>`).join("")
    : `<p class="empty">‘추첨 시작’ 버튼을 눌러보세요.</p>`;
  $("history").innerHTML = history.length
    ? history.map(h => `<div class="game"><span style="min-width:92px">${h.time}</span><div class="balls">${ballsHTML(h.nums)}</div></div>`).join("")
    : `<p class="empty">기록이 없습니다.</p>`;
}

function setHint(msg, err) { $("hint").textContent = msg; $("hint").className = "hint" + (err ? " err" : ""); }

$("gen").onclick = () => {
  const f = parseNums($("fixed").value), x = parseNums($("exclude").value);
  if (f.bad.length || x.bad.length) return setHint("번호는 1~45 사이여야 합니다.", true);
  if (f.nums.length > 5) return setHint("고정 번호는 최대 5개까지 가능합니다.", true);
  if (f.nums.some(n => x.nums.includes(n))) return setHint("같은 번호를 고정과 제외에 동시에 넣을 수 없습니다.", true);
  if (45 - x.nums.length < 7) return setHint("제외 번호가 너무 많습니다. (보너스 포함 7개가 필요해요)", true);
  setHint("");
  const weights = getWeights();
  const games = Array.from({ length: +$("count").value }, () => makeGame(f.nums, x.nums, weights));
  drawAll(games);
};

// ───────── 추첨 연출 ─────────
let drawing = false, skipping = false;
let muted = false;
try { muted = localStorage.getItem("lottoMuted") === "1"; } catch (e) {}

function sleep(ms) { return skipping ? Promise.resolve() : new Promise(r => setTimeout(r, ms)); }

// 효과음 (Web Audio, 파일 없이 생성)
let audio;
function beep(freq, dur, vol = 0.05, type = "square", when = 0) {
  if (muted || skipping) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + when, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const tick = () => beep(700 + randInt(500), 0.03, 0.025);
const ding = () => beep(1320, 0.3, 0.07, "triangle");
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.35, 0.07, "triangle", i * 0.12));

function updateSoundBtn() { $("sound").textContent = muted ? "🔇 소리 끔" : "🔊 소리 켬"; }
$("sound").onclick = () => {
  muted = !muted; updateSoundBtn();
  try { localStorage.setItem("lottoMuted", muted ? "1" : "0"); } catch (e) {}
};
updateSoundBtn();

function setStage(text, big) { $("stage").textContent = text; $("stage").className = "stage" + (big ? " big" : ""); }

function setBall(el, n, cls) { el.textContent = n; el.className = `ball ${colorClass(n)} ${cls}`; }

// 숫자가 빠르게 돌다가 점점 느려지며 멈춤
async function spinBall(el, final, duration, isBonus) {
  const start = performance.now();
  let delay = 30;
  while (!skipping && performance.now() - start < duration) {
    setBall(el, 1 + randInt(45), "spin");
    tick();
    await sleep(delay);
    delay = Math.min(delay * 1.08, 240);
  }
  setBall(el, final, "lock" + (isBonus ? " bonus" : ""));
  if (isBonus) fanfare(); else ding();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function drawAll(games) {
  drawing = true; skipping = false; current = [];
  $("gen").disabled = true; $("skip").classList.remove("hidden");
  const pending = `<span class="ball pending">?</span>`;
  $("result").innerHTML = games.map((g, i) =>
    `<div class="game"><span class="tag">${LABELS[i]}</span><div class="balls">${pending.repeat(6)}<span class="plus">+</span>${pending}</div></div>`).join("");
  const rows = [...$("result").querySelectorAll(".game")];

  setStage("추첨기를 돌리는 중…", true);
  await sleep(900);

  for (let gi = 0; gi < games.length; gi++) {
    const g = games[gi], row = rows[gi];
    const balls = [...row.querySelectorAll(".ball")];
    const speed = gi === 0 ? 1 : 0.55;           // 첫 게임은 천천히, 이후는 조금 빠르게
    row.classList.add("active");
    row.scrollIntoView({ block: "nearest", behavior: "smooth" });

    // 본 번호 6개: 실제 추첨처럼 뽑힌 순서대로 공개
    const order = shuffle(g.slice(0, 6));
    for (let k = 0; k < 6; k++) {
      setStage(`${LABELS[gi]} 게임 · ${k + 1}번째 번호`, k === 5);
      await spinBall(balls[k], order[k], (700 + k * 160) * speed);
      await sleep((k === 5 ? 500 : 280) * speed);
    }
    // 오름차순 정렬
    for (let k = 0; k < 6; k++) setBall(balls[k], g[k], "settle");
    await sleep(500 * speed);

    // 보너스: 뜸 들이기 → 길게 회전
    setStage("두구두구두구… 🥁", true);
    for (let d = 0; d < 10 && !skipping; d++) { beep(160 + d * 12, 0.08, 0.06, "sawtooth"); await sleep(110 * speed); }
    setStage(`${LABELS[gi]} 게임 · 보너스 번호!`, true);
    await spinBall(balls[6], g[6], 1900 * speed, true);
    current.push(g);
    await sleep(900 * speed);
    row.classList.remove("active");
  }

  const time = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  history = [...games.map(nums => ({ time, nums })), ...history].slice(0, 20);
  try { localStorage.setItem("lottoHistory", JSON.stringify(history)); } catch (e) {}
  if (skipping) { skipping = false; fanfare(); }
  setStage("🎉 추첨 완료! 행운을 빕니다 🍀");
  render();            // drawing=true 상태라 결과 영역은 그대로 두고 기록만 갱신
  drawing = false;
  $("gen").disabled = false; $("skip").classList.add("hidden");
}

$("skip").onclick = () => { skipping = true; };

$("copy").onclick = async () => {
  if (drawing) return setHint("추첨이 끝난 뒤에 복사할 수 있어요.", true);
  if (!current.length) return setHint("먼저 번호를 생성하세요.", true);
  const text = current.map((g, i) => `${LABELS[i]}: ${g.slice(0, 6).join(", ")} + 보너스 ${g[6]}`).join("\n");
  try { await navigator.clipboard.writeText(text); setHint("복사되었습니다!"); }
  catch (e) { setHint("복사에 실패했습니다.", true); }
};

$("clear").onclick = () => {
  history = [];
  try { localStorage.removeItem("lottoHistory"); } catch (e) {}
  render();
};

render();
renderStats();
</script>
</body>
</html>
